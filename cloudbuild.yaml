# ATENÇÃO: build do protótipo antigo (services/api); o produto real é apps/web.
# Não defina ENABLE_DEMO_ROUTES aqui nem no ambiente que roda a imagem: as rotas de custódia Pix,
# SOS e reputação são FALSAS e a custódia exige parecer jurídico (apps/web/docs/DECISOES.md,
# seção "Pagamento retido"). Rode a imagem em produção sempre com APP_ENV=production: com isso
# a API se recusa a subir se a variável de demonstração estiver ligada.
steps:
  - name: "python:3.12-slim"
    dir: "services/api"
    entrypoint: "sh"
    args: ["-c", "pip install --no-cache-dir -r requirements.txt && pytest -v"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "southamerica-east1-docker.pkg.dev/$PROJECT_ID/workeasy-repo/workeasy-api:$COMMIT_SHA", "./services/api"]
