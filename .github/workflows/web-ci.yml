name: Web CI

# The repository is public, so Actions minutes are free (decision of 24/11/2026, docs/DECISOES.md DD90).
# The paths keep the run to the changes that can break the web app.
on:
  push:
    branches: [main, develop]
    paths: ['apps/web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/web-ci.yml']
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Testar a configuração de origem do Supabase
        run: python3 -m unittest discover -s test/ops -p test_supabase_site_origin.py
      - run: npm run build
      # Budgets of the initial load (scripts/check-bundle-size.mjs): a regression fails here, not in production
      - run: npm run check:size
      # The site build is not a store build (VITE_STORE_BUILD unset): the Pro sale and the care line stay.
      - run: npm run check:store-bundle -- --store none
      # Deep links of the native apps coherent. Without --strict: the owner's placeholders (domain,
      # fingerprint, Team ID) are listed but do not fail; a contradiction between the files does.
      - run: npm run check:app-links
      - name: No secrets in the bundle
        run: |
          if grep -rIiE "gemini|api_key" dist/; then
            echo "::error::A secret-like string was found in the client bundle"
            exit 1
          fi
          # Server keys of Supabase, including a legacy service_role JWT (no prefix to grep for)
          node scripts/check-bundle-secrets.mjs --dist dist

  database:
    name: Banco de dados (pgTAP, integração, tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Mesma versão do devDependency "supabase" do package.json (conferida abaixo).
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.4.0
      - name: A CLI do CI é a do package.json
        run: |
          expected="$(node -p "require('./package.json').devDependencies.supabase")"
          actual="$(supabase --version)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::CLI do Supabase no CI ($actual) difere da do package.json ($expected)"
            exit 1
          fi
      # Aplica as migrations e o seed.sql do zero. Sem Edge Functions, Studio, Realtime e
      # os serviços de log: o banco, o Auth, a API e o Storage bastam para os testes.
      - name: Subir a stack local
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,edge-runtime
      - name: pgTAP
        run: supabase test db
      # Two real concurrent sessions per race, on a disposable database cloned inside the database
      # container (its own psql and pg_dump, port 5432). After pgTAP: 00_helpers left the tests schema.
      - name: Corridas concorrentes das ordens de pagamento (banco descartável)
        env:
          RIDE_TEST_DB_CONTAINER: supabase_db_workeasy
          PGHOST: 127.0.0.1
          PGPORT: '5432'
        run: npm run test:races
      - name: Integração (fluxo do produto contra a stack real)
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SERVICE_ROLE_KEY)=')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run test:integration
      - name: Tipos do banco em dia (lib/database.types.ts)
        run: |
          supabase gen types typescript > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u lib/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error::lib/database.types.ts está desatualizado. Rode 'npm run db:types' e faça o commit."
            exit 1
          fi
      - name: Diagnóstico da stack (só se algo falhou)
        if: failure()
        run: |
          supabase status || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'

  functions:
    name: Edge Functions (deno check e lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Versão do Deno usada no desenvolvimento (deno --version).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      # O deno.lock fica fixo (--frozen): dependência nova entra com o lock atualizado.
      - name: deno check
        run: deno check --frozen --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: deno lint
        run: deno lint --config supabase/functions/deno.json supabase/functions
      # Os testes de test/functions rodam também no runtime Deno (substituto do vitest em supabase/functions/_test).
      - name: deno test
        run: deno test --frozen --config supabase/functions/_test/deno.json --allow-read=.

  # Ponta a ponta das Edge Functions no edge-runtime (DD109): Asaas, Resend, WhatsApp e Anthropic
  # falsos em HTTPS local; nada sai para a internet. O script cria e apaga os próprios dados.
  functions-e2e:
    name: Edge Functions (ponta a ponta no edge-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Com o edge-runtime, para a imagem e o volume de cache existirem no runner limpo.
      - name: Subir a stack local
        run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime
      # O script sobe o próprio runtime com `supabase functions serve` e recusa rodar com um já de pé
      # (para não derrubar a sessão de outra pessoa). Neste runner descartável o contêiner é só nosso.
      - name: Liberar o edge-runtime para o functions serve do script
        run: docker rm -f supabase_edge_runtime_workeasy
      # Resend, WhatsApp e o SDK da Anthropic usam hosts https fixos na porta 443: o node do
      # servidor falso precisa abrir essa porta sem rodar como root.
      - name: O node pode abrir a porta 443
        run: sudo setcap 'cap_net_bind_service=+ep' "$(readlink -f "$(command -v node)")"
      - name: Ponta a ponta
        run: npm run test:e2e-functions
      - name: Diagnóstico da stack (só se algo falhou)
        if: failure()
        run: |
          npx supabase status || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
