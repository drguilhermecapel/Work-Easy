name: Release builds

# Builds WorkEasy for all six targets: website (PWA), Android, iOS, Windows,
# macOS and Linux. Runs on demand, on a version tag, and on pull requests that
# change the native packaging, so ordinary UI changes do not spend
# macOS/Windows runner minutes.
#
# Outputs are unsigned: the APK is a debug build, the iOS app runs only in the
# simulator, and the desktop installers are not code-signed. Store-ready
# builds need the Apple Developer and Google Play accounts (see README).

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'src-tauri/**'
      - 'capacitor.config.ts'
      - 'platform/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.env.native'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-web-android:
    name: Website, Android, Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Website (PWA)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: workeasy-web
          path: dist/
          retention-days: 7

      - name: Android (debug APK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run build:native && npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: workeasy-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux desktop (deb, AppImage)
        run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: workeasy-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Windows desktop (msi, exe)
        run: npx tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: workeasy-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  macos-ios:
    name: macOS, iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: macOS desktop (dmg)
        run: npx tauri build --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: workeasy-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7

      - name: iOS (simulator build, unsigned)
        run: |
          npm run build:native
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/WorkEasy-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: workeasy-ios-simulator
          path: WorkEasy-ios-simulator.zip
          retention-days: 7
