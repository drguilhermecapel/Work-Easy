name: Publicar Supabase (migrations e Edge Functions)

# Applies pending migrations, then the production catalog (supabase/catalog.sql),
# and publishes the Edge Functions of apps/web to the production Supabase project.
# Runs only on demand: there is no push or pull_request trigger. The default input
# is a dry run: with dry_run on NOTHING is published (no migration, no catalog, no
# function), with or without `ref`, and the job summary lists what would be. Secrets of the Edge
# Functions (except SITE_URL in the isolated site_origin_only job) are set manually
# (apps/web/docs/arquitetura/infra.md).
#
# Rollback of Edge Functions (there is no versioned artifact): run this workflow
# from main with `ref` set to an earlier commit, tag or branch. The functions are
# then published again from that commit, and nothing else is touched (no
# migrations, no catalog). As in any run, dry_run = true publishes nothing and only
# lists what would be published. Procedure: apps/web/docs/RUNBOOKS.md,
# "Reverter Edge Functions".

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ensaio: não publica nada (nem migrations, nem catálogo, nem funções); o resumo lista o que seria publicado'
        required: true
        type: boolean
        default: true
      auth_templates_only:
        description: 'Conferir ou publicar apenas os dois modelos de e-mail de código'
        type: boolean
        default: false
      site_origin_only:
        description: 'Conferir ou configurar apenas o domínio público e o retorno /conta no Auth e nas Edge Functions'
        type: boolean
        default: false
      deploy_functions:
        description: 'Publicar as Edge Functions'
        required: true
        type: boolean
        default: false
      ref:
        description: 'Reverter funções: commit (SHA), tag ou branch a publicar de novo. Vazio = o commit deste workflow. Com ref: só funções (exige "Publicar as Edge Functions"), sem migrations nem catálogo; o commit precisa estar no histórico de main; com o ensaio (dry_run) ligado nada é publicado'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  auth-templates:
    name: Modelos de confirmação e login
    if: inputs.auth_templates_only && !inputs.site_origin_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Confirmar a branch e o modo
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || -n "$REQUESTED_REF" || "$DEPLOY_FUNCTIONS" == true ]]; then
            echo "::error::Use main, ref vazio e publicação de funções desligada para atualizar os modelos."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Conferir ou aplicar os modelos Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            python3 apps/web/scripts/supabase-auth-templates.py
          else
            python3 apps/web/scripts/supabase-auth-templates.py --apply
          fi

  site-origin:
    name: Origem pública de produção
    if: inputs.site_origin_only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    steps:
      - name: Confirmar a branch e o modo
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
          AUTH_TEMPLATES: ${{ inputs.auth_templates_only }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || -n "$REQUESTED_REF" || "$DEPLOY_FUNCTIONS" == true || "$AUTH_TEMPLATES" == true ]]; then
            echo "::error::Use apenas o modo de origem pública, em main, sem ref."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sincronizar a origem pública
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_CONFIG_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://workeasy.ia.br' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == false ]]; then args+=(--apply); fi
          set -o pipefail
          python3 apps/web/scripts/supabase_site_origin.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  supabase:
    if: ${{ !inputs.auth_templates_only && !inputs.site_origin_only }}
    name: Migrations e Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional: CLI 3.4.0 uses a temporary database login when no password is set.
      # The PAT then needs Database Read/Write and Connection Pooling Read permissions.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      # Checkout first: the steps run in apps/web, which exists only after it.
      # `ref` is only passed through `with:` (never interpolated into a shell line).
      # Full history, because a `ref` must be proved to be part of main's history.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The workflow file itself always comes from main: only main may be dispatched.
      - name: Confirmar a branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::O banco de produção só é alterado a partir da branch main."
            exit 1
          fi

      # With a ref this job is a rollback of functions: it must publish functions, only
      # commits already in main's history are accepted, and the SHA is written to the summary.
      - name: Registrar o commit a publicar
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
        run: |
          sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --format=%s HEAD)"
          mode="publicação normal (commit deste workflow)"
          if [ -n "$REQUESTED_REF" ]; then
            mode="reversão de Edge Functions (ref informado)"
            if [ "$DEPLOY_FUNCTIONS" != "true" ]; then
              echo "::error::Com ref, ligue 'Publicar as Edge Functions': a reversão só publica funções."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::O commit $sha não está no histórico de main."
              exit 1
            fi
            newer="$(git diff --name-only --diff-filter=A "$sha" origin/main -- supabase/migrations | wc -l)"
            if [ "$newer" -gt 0 ]; then
              echo "::warning::Há $newer migration(s) em main que o commit $sha não tem. As funções antigas rodarão contra o banco novo: confira a compatibilidade (RUNBOOKS, Reverter Edge Functions)."
            fi
          fi
          {
            echo "### Publicação do Supabase"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Modo | $mode |"
            echo "| ref pedido | \`${REQUESTED_REF:-(vazio)}\` |"
            echo "| SHA publicado | \`$sha\` |"
            echo "| SHA deste workflow (main) | \`$WORKFLOW_SHA\` |"
            echo "| Assunto do commit | $subject |"
            echo "| Ensaio (dry_run) | $DRY_RUN |"
            echo "| Publicar as Edge Functions | $DEPLOY_FUNCTIONS |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Commit a publicar: $sha ($subject)"

      - name: Conferir variáveis obrigatórias
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta $name no ambiente production."
              exit 1
            fi
          done

      # Same CLI version as the devDependency in apps/web/package.json.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.4.0

      - name: Conferir que a CLI é a do package.json
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          expected="$(node -p "require('./package.json').devDependencies.supabase")"
          actual="$(supabase --version)"
          if [ "$expected" != "$actual" ]; then
            if [ -n "$REQUESTED_REF" ]; then
              # An older commit may pin another CLI; the rollback still uses the one of main.
              echo "::warning::CLI do Supabase ($actual) difere da do package.json do ref ($expected)."
            else
              echo "::error::CLI do Supabase ($actual) difere da do package.json ($expected)."
              exit 1
            fi
          fi

      - name: Vincular o projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Migrations come first, then the catalog. supabase/seed.sql is the development
      # seed and is never applied here (db push does not include it without
      # --include-seed). supabase/catalog.sql is the production catalog, generated from
      # the same source and holding nothing but the four catalog tables.
      # --skip-vault keeps config.toml from touching vault secrets. CLI 3: --remote is the
      # linked project (it replaces the flag of CLI 2, deprecated in 3), and a change to a hosted project asks for
      # confirmation, so the steps that change something pass --yes.
      - name: Listar migrations pendentes
        if: ${{ inputs.ref == '' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Without `shell: bash` the step runs `bash -e`, with no pipefail: a failing push must fail the step.
          set -o pipefail
          supabase db push --remote --skip-vault --dry-run | tee "$RUNNER_TEMP/pending-migrations.txt"
          {
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "Migrations que seriam aplicadas (ensaio: nada aplicado):"
            else
              echo "Migrations pendentes (aplicadas no passo seguinte):"
            fi
            echo '```'
            cat "$RUNNER_TEMP/pending-migrations.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The file must be, byte for byte, what scripts/generate-seed.mjs makes from
      # catalog/*.json and data/neighborhoods.json, and every statement in it must be an
      # upsert into one of the four catalog tables (scripts/check-catalog-sql.mjs, tested
      # in test/ops/check-catalog-sql.test.ts). No npm ci here: the script has no dependency.
      - name: Conferir que o catálogo só toca tabelas de catálogo
        if: ${{ inputs.ref == '' }}
        run: node scripts/check-catalog-sql.mjs supabase/catalog.sql

      - name: Aplicar migrations pendentes
        if: ${{ !inputs.dry_run && inputs.ref == '' }}
        run: supabase db push --remote --skip-vault --yes

      # One transaction, idempotent (insert ... on conflict do update). Catalog rows are
      # overwritten with the repository's values: change them only in the repository.
      - name: Aplicar o catálogo
        if: ${{ !inputs.dry_run && inputs.ref == '' }}
        run: supabase db query --remote --yes -f supabase/catalog.sql

      # The functions to publish, the same list for a rehearsal and for a real run: one line
      # per function, "<name> no-jwt" or "<name> jwt". asaas-webhook (Asaas), notify-dispatch
      # and scheduled jobs receive no user JWT, so they are published
      # with --no-verify-jwt; every other function keeps JWT verification. config.toml also
      # sets verify_jwt = false for these jobs; the flag is redundant and kept as a second
      # guard. The dedicated Asaas sandbox endpoints belong only in a test project.
      - name: Listar as Edge Functions a publicar
        if: ${{ inputs.deploy_functions }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          list="$RUNNER_TEMP/functions.txt"
          : > "$list"
          for fn in asaas-webhook notify-dispatch background-check-purge ride-alerts ride-dossier-purge ride-live-webhook ride-order-webhook ride-wallet-webhook; do
            if [ ! -d "supabase/functions/$fn" ]; then
              # An older commit (rollback) may predate a function: nothing to publish.
              echo "::warning::$fn não existe neste commit; nada a publicar."
              continue
            fi
            echo "$fn no-jwt" >> "$list"
          done
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            case "$fn" in
              _*|asaas-webhook|notify-dispatch|background-check-purge|ride-alerts|ride-dossier-purge|ride-live-webhook|ride-order-webhook|ride-wallet-webhook|ride-sandbox-checkout|ride-sandbox-webhook) continue ;;
            esac
            echo "$fn jwt" >> "$list"
          done
          {
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "Edge Functions que seriam publicadas a partir de $(git rev-parse HEAD) (ensaio: nada publicado):"
            else
              echo "Edge Functions a publicar a partir de $(git rev-parse HEAD):"
            fi
            while read -r fn mode; do
              if [ "$mode" = "no-jwt" ]; then echo "- \`$fn\` (sem JWT)"; else echo "- \`$fn\`"; fi
            done < "$list"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$list"

      # dry_run stops every publication, with or without ref: the list above is all that a
      # rehearsal does with the functions.
      - name: Publicar Edge Functions
        if: ${{ inputs.deploy_functions && !inputs.dry_run }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Edge Functions publicadas:" >> "$GITHUB_STEP_SUMMARY"
          while read -r fn mode; do
            if [ "$mode" = "no-jwt" ]; then
              supabase functions deploy "$fn" --remote="$SUPABASE_PROJECT_ID" --yes --no-verify-jwt
              echo "- \`$fn\` (sem JWT)" >> "$GITHUB_STEP_SUMMARY"
            else
              supabase functions deploy "$fn" --remote="$SUPABASE_PROJECT_ID" --yes
              echo "- \`$fn\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RUNNER_TEMP/functions.txt"

      - name: Registrar o ensaio
        if: ${{ inputs.dry_run }}
        env:
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          {
            echo ""
            echo "**Ensaio (dry_run): nada foi publicado.** Nenhuma migration aplicada, catálogo não aplicado e nenhuma Edge Function publicada."
            if [ -n "$REQUESTED_REF" ]; then
              echo "Sem dry_run, esta execução publicaria só as funções listadas (com ref não há migrations nem catálogo)."
            elif [ "$DEPLOY_FUNCTIONS" = "true" ]; then
              echo "Sem dry_run, esta execução aplicaria as migrations listadas e o catálogo e publicaria as funções listadas."
            else
              echo "Sem dry_run, esta execução aplicaria as migrations listadas e o catálogo; a publicação das funções não foi pedida."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
