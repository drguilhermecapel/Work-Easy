name: Publicar Supabase (migrations e Edge Functions)

# Applies pending migrations, then the production catalog (supabase/catalog.sql),
# and publishes the Edge Functions of apps/web to the production Supabase project.
# Runs only on demand: there is no push or pull_request trigger. The default input
# is a dry run that only lists the pending migrations. Secrets of the Edge
# Functions (ASAAS_BASE_URL, APP_ENV, ...) are NOT set here: that is a manual step
# (apps/web/docs/arquitetura/infra.md).
#
# Rollback of Edge Functions (there is no versioned artifact): run this workflow
# from main with `ref` set to an earlier commit, tag or branch. The functions are
# then published again from that commit, and nothing else is touched (no
# migrations, no catalog). With `ref`, dry_run = true publishes nothing and only
# lists what would be published. Procedure: apps/web/docs/RUNBOOKS.md,
# "Reverter Edge Functions".

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só listar as migrations pendentes, sem aplicar'
        required: true
        type: boolean
        default: true
      deploy_functions:
        description: 'Publicar as Edge Functions'
        required: true
        type: boolean
        default: false
      ref:
        description: 'Reverter funções: commit (SHA), tag ou branch a publicar de novo. Vazio = o commit deste workflow. Com ref: só funções (exige "Publicar as Edge Functions"), sem migrations nem catálogo; o commit precisa estar no histórico de main; com "Só listar" ligado nada é publicado'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  supabase:
    name: Migrations e Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      # Checkout first: the steps run in apps/web, which exists only after it.
      # `ref` is only passed through `with:` (never interpolated into a shell line).
      # Full history, because a `ref` must be proved to be part of main's history.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The workflow file itself always comes from main: only main may be dispatched.
      - name: Confirmar a branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::O banco de produção só é alterado a partir da branch main."
            exit 1
          fi

      # With a ref this job is a rollback of functions: it must publish functions, only
      # commits already in main's history are accepted, and the SHA is written to the summary.
      - name: Registrar o commit a publicar
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_FUNCTIONS: ${{ inputs.deploy_functions }}
        run: |
          sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --format=%s HEAD)"
          mode="publicação normal (commit deste workflow)"
          if [ -n "$REQUESTED_REF" ]; then
            mode="reversão de Edge Functions (ref informado)"
            if [ "$DEPLOY_FUNCTIONS" != "true" ]; then
              echo "::error::Com ref, ligue 'Publicar as Edge Functions': a reversão só publica funções."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::O commit $sha não está no histórico de main."
              exit 1
            fi
            newer="$(git diff --name-only --diff-filter=A "$sha" origin/main -- supabase/migrations | wc -l)"
            if [ "$newer" -gt 0 ]; then
              echo "::warning::Há $newer migration(s) em main que o commit $sha não tem. As funções antigas rodarão contra o banco novo: confira a compatibilidade (RUNBOOKS, Reverter Edge Functions)."
            fi
          fi
          {
            echo "### Publicação do Supabase"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Modo | $mode |"
            echo "| ref pedido | \`${REQUESTED_REF:-(vazio)}\` |"
            echo "| SHA publicado | \`$sha\` |"
            echo "| SHA deste workflow (main) | \`$WORKFLOW_SHA\` |"
            echo "| Assunto do commit | $subject |"
            echo "| Só listar (dry_run) | $DRY_RUN |"
            echo "| Publicar as Edge Functions | $DEPLOY_FUNCTIONS |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Commit a publicar: $sha ($subject)"

      - name: Conferir variáveis obrigatórias
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta $name no ambiente production."
              exit 1
            fi
          done

      # Same CLI version as the devDependency in apps/web/package.json.
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 2.121.0

      - name: Conferir que a CLI é a do package.json
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          expected="$(node -p "require('./package.json').devDependencies.supabase")"
          actual="$(supabase --version)"
          if [ "$expected" != "$actual" ]; then
            if [ -n "$REQUESTED_REF" ]; then
              # An older commit may pin another CLI; the rollback still uses the one of main.
              echo "::warning::CLI do Supabase ($actual) difere da do package.json do ref ($expected)."
            else
              echo "::error::CLI do Supabase ($actual) difere da do package.json ($expected)."
              exit 1
            fi
          fi

      - name: Vincular o projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Migrations come first, then the catalog. supabase/seed.sql is the development
      # seed and is never applied here (db push does not include it without
      # --include-seed). supabase/catalog.sql is the production catalog, generated from
      # the same source and holding nothing but the four catalog tables.
      # --skip-vault keeps config.toml from touching vault secrets.
      - name: Listar migrations pendentes
        if: ${{ inputs.ref == '' }}
        run: supabase db push --linked --skip-vault --dry-run

      - name: Conferir que o catálogo só toca tabelas de catálogo
        if: ${{ inputs.ref == '' }}
        run: |
          test -s supabase/catalog.sql
          grep -m1 -E '^-- [0-9]+ areas' supabase/catalog.sql
          # Lines allowed at column 0: comments, begin/commit, the catalog inserts and the
          # on conflict clause. Indented lines are the rows and the do-update set.
          if grep -vE -e '^--' -e '^begin;$' -e '^commit;$' -e '^$' -e '^  ' -e '^on conflict ' \
              -e '^insert into public\.(areas|occupations|occupation_policies|neighborhoods) \(' supabase/catalog.sql; then
            echo "::error::supabase/catalog.sql tem instruções fora do catálogo."
            exit 1
          fi

      - name: Aplicar migrations pendentes
        if: ${{ !inputs.dry_run && inputs.ref == '' }}
        run: supabase db push --linked --skip-vault --yes

      # One transaction, idempotent (insert ... on conflict do update). Catalog rows are
      # overwritten with the repository's values: change them only in the repository.
      - name: Aplicar o catálogo
        if: ${{ !inputs.dry_run && inputs.ref == '' }}
        run: supabase db query --linked -f supabase/catalog.sql

      # Rehearsal of a rollback: with a ref and dry_run, list what would be published.
      - name: Listar as Edge Functions do ref (ensaio)
        if: ${{ inputs.deploy_functions && inputs.ref != '' && inputs.dry_run }}
        run: |
          {
            echo ""
            echo "Ensaio: nada foi publicado. Funções que seriam publicadas a partir de $(git rev-parse --short HEAD):"
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            case "$fn" in _*) continue ;; esac
            echo "- \`$fn\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$fn"
          done

      # With a ref, dry_run also stops the publication (without a ref, dry_run only
      # covers the migrations, as before).
      - name: Publicar Edge Functions
        if: ${{ inputs.deploy_functions && (inputs.ref == '' || !inputs.dry_run) }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Edge Functions publicadas a partir de $(git rev-parse HEAD):" >> "$GITHUB_STEP_SUMMARY"
          # asaas-webhook (Asaas) and notify-dispatch (scheduled job) receive no
          # user JWT, so they are published with --no-verify-jwt. Every other
          # function keeps JWT verification. config.toml also sets verify_jwt = false
          # for the three; the flag here is redundant and kept as a second guard.
          for fn in asaas-webhook notify-dispatch background-check-purge; do
            if [ ! -d "supabase/functions/$fn" ]; then
              # An older commit (rollback) may predate a function: nothing to publish.
              echo "::warning::$fn não existe neste commit; nada a publicar."
              continue
            fi
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
            echo "- \`$fn\` (sem JWT)" >> "$GITHUB_STEP_SUMMARY"
          done
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            case "$fn" in
              _*|asaas-webhook|notify-dispatch|background-check-purge) continue ;; # _shared and _runtime are libraries
            esac
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
            echo "- \`$fn\`" >> "$GITHUB_STEP_SUMMARY"
          done
