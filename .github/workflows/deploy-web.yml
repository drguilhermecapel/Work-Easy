name: Publicar site (Cloudflare Pages)

# Builds apps/web and publishes it to a Cloudflare Pages project.
# Runs only on demand: there is no push or pull_request trigger, so a branch or
# a pull request never publishes anything. Production is published only from
# main, after the typed confirmation, and after an approval from the reviewers
# of the "production" environment. See apps/web/docs/arquitetura/infra.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DEPLOY para publicar em produção'
        required: true
        type: string
      sync_auth_templates:
        description: 'Aplicar e conferir os modelos de código de acesso antes de publicar o site'
        type: boolean
        default: false

permissions:
  contents: read

# One production publish at a time. A publish already running is never cancelled.
concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build e publicação
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.VITE_SITE_URL }}
    # Every VITE_ value is embedded in the public bundle, so they are variables
    # (not secrets) and none of them may hold a secret.
    env:
      WORKEASY_RELEASE_TARGET: web
      VITE_ROUTER: browser
      VITE_STORE_BUILD: ''
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_CONCIERGE_WHATSAPP: ${{ vars.VITE_CONCIERGE_WHATSAPP || '5511997594545' }}
      VITE_COMPANY_NAME: ${{ vars.VITE_COMPANY_NAME }}
      VITE_COMPANY_CNPJ: ${{ vars.VITE_COMPANY_CNPJ }}
      VITE_COMPANY_ADDRESS: ${{ vars.VITE_COMPANY_ADDRESS }}
      VITE_SAC_EMAIL: ${{ vars.VITE_SAC_EMAIL }}
      VITE_SAC_WHATSAPP: ${{ vars.VITE_SAC_WHATSAPP || '5511997594545' }}
      VITE_LEGAL_STATUS: ${{ vars.VITE_LEGAL_STATUS }}
      VITE_LOGIN_METHODS: ${{ vars.VITE_LOGIN_METHODS || 'email' }}
      # Error reporting: without the DSN the production build reports nothing (lib/observability.ts).
      # The DSN is public by design; the release is the commit being published.
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_APP_VERSION: ${{ github.sha }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      # Checkout first: the steps below run in apps/web, which exists only after it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Confirmar a publicação de produção
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A produção só é publicada a partir da branch main."
            exit 1
          fi
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::Digite DEPLOY para confirmar a publicação."
            exit 1
          fi

      - name: Aplicar ou conferir os modelos de login no Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SYNC_AUTH_TEMPLATES: ${{ inputs.sync_auth_templates }}
        run: |
          if [[ "$SYNC_AUTH_TEMPLATES" == true ]]; then
            python3 scripts/supabase-auth-templates.py --apply
          else
            python3 scripts/supabase-auth-templates.py --verify
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar a configuração e consultar o backend de produção
        run: node scripts/release-config.mjs backend

      - name: Conferir o projeto e o domínio no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: node scripts/cloudflare-pages-release.mjs project

      # Wrangler comes from its own lock (tools/wrangler/package-lock.json, exact version and
      # integrity hashes), installed only here: the other jobs never download it.
      - name: Instalar o wrangler
        working-directory: apps/web/tools/wrangler
        run: npm ci

      - name: Lint e testes
        run: |
          npm run lint
          npm test

      - name: Build do site (inclui a pré-renderização)
        run: npm run build

      - name: Conferir a configuração no bundle
        run: |
          node scripts/release-config.mjs bundle
          node scripts/release-config.mjs web-links
          node scripts/cloudflare-pages-release.mjs write
          npm run check:store-bundle -- --store none

      - name: Conferir o tamanho da carga inicial
        run: npm run check:size

      - name: Conferir cabeçalhos e HTML gerado
        run: node scripts/check-headers.mjs --dist dist --site-url "$VITE_SITE_URL"

      - name: Conferir que o bundle público não tem segredos
        run: |
          if ! node scripts/check-bundle-secrets.mjs --dist dist; then
            echo "::error::Padrão de segredo encontrado no bundle público."
            exit 1
          fi

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: 'false'
        # The wrangler of tools/wrangler/package-lock.json (never `npx --yes`, which would resolve
        # it from the registry at run time). --branch main makes this a production deployment.
        run: tools/wrangler/node_modules/.bin/wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"

      - name: Conferir o site no domínio canônico
        run: |
          for attempt in 1 2 3; do
            if node scripts/cloudflare-pages-release.mjs live &&
               node scripts/healthcheck.mjs --paths /,/entrar,/pedido,/sac,/privacidade,/termos; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Registrar a publicação
        run: |
          echo "Commit publicado: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
