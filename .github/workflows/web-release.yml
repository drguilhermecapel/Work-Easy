name: Web release builds

# PRs and default manual runs build smoke packages. A version tag builds a
# production-connected prerelease from a commit already integrated into main.
on:
  workflow_dispatch:
    inputs:
      macos_universal:
        description: Verificar o DMG macOS arm64 e Intel
        type: boolean
        default: false
      windows_install_smoke:
        description: Verificar instalação, abertura e remoção dos dois pacotes Windows
        type: boolean
        default: false
  push:
    tags: ['v*']
  # Only the changes that can break a native build (the macOS and Windows runners are slower), not every UI change
  pull_request:
    paths:
      - 'apps/web/android/**'
      - 'apps/web/ios/**'
      - 'apps/web/src-tauri/**'
      - 'apps/web/capacitor.config.ts'
      - 'apps/web/platform/**'
      - 'apps/web/vite.config.ts'
      - 'apps/web/scripts/release-config.*'
      - 'apps/web/scripts/check-android-install.sh'
      - 'apps/web/scripts/check-ios-simulator.sh'
      - 'apps/web/scripts/android-release.sh'
      - 'apps/web/scripts/ios-release.sh'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/.env.native'
      - '.github/workflows/web-release.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-config:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      WORKEASY_RELEASE_TARGET: web
      VITE_ROUTER: browser
      VITE_STORE_BUILD: ''
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_CONCIERGE_WHATSAPP: ${{ vars.VITE_CONCIERGE_WHATSAPP || '5511997594545' }}
      VITE_SAC_WHATSAPP: ${{ vars.VITE_SAC_WHATSAPP || '5511997594545' }}
      VITE_SAC_EMAIL: ${{ vars.VITE_SAC_EMAIL }}
      VITE_COMPANY_NAME: ${{ vars.VITE_COMPANY_NAME }}
      VITE_COMPANY_CNPJ: ${{ vars.VITE_COMPANY_CNPJ }}
      VITE_COMPANY_ADDRESS: ${{ vars.VITE_COMPANY_ADDRESS }}
      VITE_LEGAL_STATUS: ${{ vars.VITE_LEGAL_STATUS }}
      VITE_LOGIN_METHODS: ${{ vars.VITE_LOGIN_METHODS || 'email' }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    outputs:
      VITE_SUPABASE_URL: ${{ steps.config.outputs.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.config.outputs.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ steps.config.outputs.VITE_SITE_URL }}
      VITE_CONCIERGE_WHATSAPP: ${{ steps.config.outputs.VITE_CONCIERGE_WHATSAPP }}
      VITE_SAC_WHATSAPP: ${{ steps.config.outputs.VITE_SAC_WHATSAPP }}
      VITE_SAC_EMAIL: ${{ steps.config.outputs.VITE_SAC_EMAIL }}
      VITE_COMPANY_NAME: ${{ steps.config.outputs.VITE_COMPANY_NAME }}
      VITE_COMPANY_CNPJ: ${{ steps.config.outputs.VITE_COMPANY_CNPJ }}
      VITE_COMPANY_ADDRESS: ${{ steps.config.outputs.VITE_COMPANY_ADDRESS }}
      VITE_LEGAL_STATUS: ${{ steps.config.outputs.VITE_LEGAL_STATUS }}
      VITE_LOGIN_METHODS: ${{ steps.config.outputs.VITE_LOGIN_METHODS }}
      VITE_SENTRY_DSN: ${{ steps.config.outputs.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar tag e revisão
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$version" ]]
          node -e "if (require('./src-tauri/tauri.conf.json').version !== process.argv[1]) process.exit(1)" "$version"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: node scripts/release-config.mjs backend
      - name: Transferir somente a configuração pública validada
        id: config
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const names = ['VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY', 'VITE_SITE_URL', 'VITE_CONCIERGE_WHATSAPP', 'VITE_SAC_WHATSAPP', 'VITE_SAC_EMAIL', 'VITE_COMPANY_NAME', 'VITE_COMPANY_CNPJ', 'VITE_COMPANY_ADDRESS', 'VITE_LEGAL_STATUS', 'VITE_LOGIN_METHODS', 'VITE_SENTRY_DSN'];
          for (const name of names) {
            const value = process.env[name] ?? '';
            if (/[\r\n]/.test(value)) throw new Error(`Valor multilinha recusado: ${name}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          NODE

  linux-web-android:
    name: Website, Android, Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: production-config
    if: ${{ !cancelled() && !inputs.macos_universal && !inputs.windows_install_smoke && (needs.production-config.result == 'success' || needs.production-config.result == 'skipped') }}
    env:
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_SUPABASE_URL: ${{ needs.production-config.outputs.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ needs.production-config.outputs.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ needs.production-config.outputs.VITE_SITE_URL }}
      VITE_CONCIERGE_WHATSAPP: ${{ needs.production-config.outputs.VITE_CONCIERGE_WHATSAPP }}
      VITE_SAC_WHATSAPP: ${{ needs.production-config.outputs.VITE_SAC_WHATSAPP }}
      VITE_SAC_EMAIL: ${{ needs.production-config.outputs.VITE_SAC_EMAIL }}
      VITE_COMPANY_NAME: ${{ needs.production-config.outputs.VITE_COMPANY_NAME }}
      VITE_COMPANY_CNPJ: ${{ needs.production-config.outputs.VITE_COMPANY_CNPJ }}
      VITE_COMPANY_ADDRESS: ${{ needs.production-config.outputs.VITE_COMPANY_ADDRESS }}
      VITE_LEGAL_STATUS: ${{ needs.production-config.outputs.VITE_LEGAL_STATUS }}
      VITE_LOGIN_METHODS: ${{ needs.production-config.outputs.VITE_LOGIN_METHODS }}
      VITE_SENTRY_DSN: ${{ needs.production-config.outputs.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test

      - name: Website (PWA)
        env:
          VITE_ROUTER: browser
          TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ "$TAG_BUILD" == true ]]; then export WORKEASY_RELEASE_TARGET=web; fi
          npm run build
          if [[ "$TAG_BUILD" == true ]]; then
            node scripts/release-config.mjs bundle
            node scripts/release-config.mjs web-links
            npm run check:size
            npm run check:store-bundle -- --store none
            node scripts/check-headers.mjs --dist dist --site-url "$VITE_SITE_URL"
            node scripts/check-bundle-secrets.mjs --dist dist
            npm sbom --omit=dev --sbom-format=cyclonedx > "$GITHUB_WORKSPACE/WorkEasy-web.cdx.json"
            tar -C dist -czf "$GITHUB_WORKSPACE/WorkEasy-web.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: workeasy-web
          path: |
            apps/web/dist/
            WorkEasy-web.tar.gz
            WorkEasy-web.cdx.json
          retention-days: 7

      - name: Android (debug APK)
        if: github.ref_type != 'tag'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: github.ref_type != 'tag'
        run: npm run build:native && npx cap sync android
      - if: github.ref_type != 'tag'
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/web/android
      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: workeasy-android-apk
          path: apps/web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Instalar o APK e verificar a Home no emulador Android
        if: github.ref_type != 'tag'
        timeout-minutes: 15
        run: |
          image='system-images;android-35;google_apis;x86_64'
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "$image" 'emulator'
          echo no | avdmanager create avd -n workeasy -k "$image" --force
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd workeasy -port 5554 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/workeasy-avd.log" 2>&1 &
          export ANDROID_SERIAL=emulator-5554
          trap 'adb emu kill >/dev/null 2>&1 || true' EXIT
          timeout 300 bash -c 'adb wait-for-device && until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          bash scripts/check-android-install.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # Fixed Rust (src-tauri/Cargo.toml rust-version): a new stable release does not change the build.
      # The action has a branch per Rust version; the SHA is the tip of its 1.90.0 branch.
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/web/src-tauri
      - name: Linux desktop (deb, AppImage)
        shell: bash
        env:
          TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ "$TAG_BUILD" == true ]]; then
            export WORKEASY_RELEASE_TARGET=linux
            npx tauri build --bundles deb,appimage -- --locked
            node scripts/release-config.mjs bundle
            node scripts/check-bundle-secrets.mjs --dist dist
          else
            npx tauri build --bundles deb,appimage -- --locked
          fi
      - name: Registrar licenças das dependências Rust
        if: github.ref_type == 'tag'
        run: |
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml |
            node scripts/release-rust-licenses.mjs > "$GITHUB_WORKSPACE/WorkEasy-rust-licenses.json"
      - uses: actions/upload-artifact@v7
        with:
          name: workeasy-linux
          path: |
            apps/web/src-tauri/target/release/bundle/deb/*.deb
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage
            WorkEasy-rust-licenses.json
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    needs: production-config
    if: ${{ !cancelled() && (!inputs.macos_universal || inputs.windows_install_smoke) && (needs.production-config.result == 'success' || needs.production-config.result == 'skipped') }}
    env:
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_SUPABASE_URL: ${{ needs.production-config.outputs.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ needs.production-config.outputs.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ needs.production-config.outputs.VITE_SITE_URL }}
      VITE_CONCIERGE_WHATSAPP: ${{ needs.production-config.outputs.VITE_CONCIERGE_WHATSAPP }}
      VITE_SAC_WHATSAPP: ${{ needs.production-config.outputs.VITE_SAC_WHATSAPP }}
      VITE_SAC_EMAIL: ${{ needs.production-config.outputs.VITE_SAC_EMAIL }}
      VITE_COMPANY_NAME: ${{ needs.production-config.outputs.VITE_COMPANY_NAME }}
      VITE_COMPANY_CNPJ: ${{ needs.production-config.outputs.VITE_COMPANY_CNPJ }}
      VITE_COMPANY_ADDRESS: ${{ needs.production-config.outputs.VITE_COMPANY_ADDRESS }}
      VITE_LEGAL_STATUS: ${{ needs.production-config.outputs.VITE_LEGAL_STATUS }}
      VITE_LOGIN_METHODS: ${{ needs.production-config.outputs.VITE_LOGIN_METHODS }}
      VITE_SENTRY_DSN: ${{ needs.production-config.outputs.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Fixed Rust (src-tauri/Cargo.toml rust-version): a new stable release does not change the build.
      # The action has a branch per Rust version; the SHA is the tip of its 1.90.0 branch.
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/web/src-tauri
      - name: Windows desktop (msi, exe)
        shell: bash
        env:
          TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ "$TAG_BUILD" == true ]]; then
            export WORKEASY_RELEASE_TARGET=windows
            npx tauri build --bundles msi,nsis -- --locked
            node scripts/release-config.mjs bundle
            node scripts/check-bundle-secrets.mjs --dist dist
          else
            npx tauri build --bundles msi,nsis -- --locked
          fi
      - name: Ensaiar instalação, abertura e remoção no Windows
        if: inputs.windows_install_smoke
        shell: pwsh
        run: ./scripts/check-windows-installers.ps1 -BundleDir src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: workeasy-windows
          path: |
            apps/web/src-tauri/target/release/bundle/msi/*.msi
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  macos-ios:
    name: macOS, iOS
    runs-on: macos-latest
    timeout-minutes: 60
    needs: production-config
    if: ${{ !cancelled() && (!inputs.windows_install_smoke || inputs.macos_universal) && (needs.production-config.result == 'success' || needs.production-config.result == 'skipped') }}
    env:
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_SUPABASE_URL: ${{ needs.production-config.outputs.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ needs.production-config.outputs.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SITE_URL: ${{ needs.production-config.outputs.VITE_SITE_URL }}
      VITE_CONCIERGE_WHATSAPP: ${{ needs.production-config.outputs.VITE_CONCIERGE_WHATSAPP }}
      VITE_SAC_WHATSAPP: ${{ needs.production-config.outputs.VITE_SAC_WHATSAPP }}
      VITE_SAC_EMAIL: ${{ needs.production-config.outputs.VITE_SAC_EMAIL }}
      VITE_COMPANY_NAME: ${{ needs.production-config.outputs.VITE_COMPANY_NAME }}
      VITE_COMPANY_CNPJ: ${{ needs.production-config.outputs.VITE_COMPANY_CNPJ }}
      VITE_COMPANY_ADDRESS: ${{ needs.production-config.outputs.VITE_COMPANY_ADDRESS }}
      VITE_LEGAL_STATUS: ${{ needs.production-config.outputs.VITE_LEGAL_STATUS }}
      VITE_LOGIN_METHODS: ${{ needs.production-config.outputs.VITE_LOGIN_METHODS }}
      VITE_SENTRY_DSN: ${{ needs.production-config.outputs.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Fixed Rust (src-tauri/Cargo.toml rust-version): a new stable release does not change the build.
      # The action has a branch per Rust version; the SHA is the tip of its 1.90.0 branch.
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/web/src-tauri
      - name: Instalar alvos para macOS universal
        if: github.ref_type == 'tag' || inputs.macos_universal
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: macOS desktop (dmg)
        shell: bash
        env:
          TAG_BUILD: ${{ github.ref_type == 'tag' }}
          UNIVERSAL: ${{ github.ref_type == 'tag' || inputs.macos_universal }}
        run: |
          if [[ "$TAG_BUILD" == true ]]; then export WORKEASY_RELEASE_TARGET=macos; fi
          if [[ "$UNIVERSAL" == true ]]; then
            npx tauri build --target universal-apple-darwin --bundles app,dmg -- --locked
            shopt -s nullglob
            images=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
            [[ "${#images[@]}" == 1 ]]
            mountpoint="$(mktemp -d)"
            trap 'hdiutil detach "$mountpoint" && rmdir "$mountpoint"' EXIT
            hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
            app="$mountpoint/WorkEasy.app"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
            lipo -archs "$app/Contents/MacOS/$executable"
            shasum -a 256 "${images[0]}"
          else
            npx tauri build --bundles app,dmg -- --locked
          fi
          if [[ "$TAG_BUILD" == true ]]; then
            node scripts/release-config.mjs bundle
            node scripts/check-bundle-secrets.mjs --dist dist
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: workeasy-macos
          if-no-files-found: error
          path: |
            apps/web/src-tauri/target/release/bundle/dmg/*.dmg
            apps/web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

      - name: iOS (simulator build, unsigned)
        if: github.ref_type != 'tag' && !inputs.macos_universal
        run: |
          npm run build:native
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/WorkEasy-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag' && !inputs.macos_universal
        with:
          name: workeasy-ios-simulator
          path: WorkEasy-ios-simulator.zip
          retention-days: 7

  ios-installed:
    name: Instalação em simulador ${{ matrix.family }}
    needs: macos-ios
    if: ${{ !cancelled() && needs.macos-ios.result == 'success' && github.ref_type != 'tag' && !inputs.macos_universal && !inputs.windows_install_smoke }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: workeasy-ios-simulator
          path: ${{ runner.temp }}/workeasy
      - name: Instalar, reabrir e remover o app
        run: bash scripts/check-ios-simulator.sh "$RUNNER_TEMP/workeasy/WorkEasy-ios-simulator.zip" "${{ matrix.family }}"

  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [production-config, linux-web-android, windows, macos-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release-input
          pattern: workeasy-*
      - name: Registrar arquivos e publicar prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-manifest.mjs
          gh release create "$GITHUB_REF_NAME" "${GITHUB_WORKSPACE}/release-files/"* \
            --verify-tag --prerelease --title "WorkEasy $GITHUB_REF_NAME" \
            --notes-file "${GITHUB_WORKSPACE}/release-files/NOTAS.md"
      - name: Verificar os arquivos baixados do canal final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/download" --pattern '*'
          cd "$RUNNER_TEMP/download"
          cmp SHA256SUMS "$GITHUB_WORKSPACE/release-files/SHA256SUMS"
          sha256sum --check SHA256SUMS
