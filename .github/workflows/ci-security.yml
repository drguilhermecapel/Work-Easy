name: WorkEasy CI
on:
  # Manual only: GitHub Actions spend is not allowed in this project. Run it from the
  # Actions tab (Run workflow) when needed; no push or pull request starts it.
  workflow_dispatch:

# The job only reads the repository: no token write scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: ./services/api
        run: |
          pip install -r requirements.txt
          pytest -v
