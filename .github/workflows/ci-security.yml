name: WorkEasy CI
on:
  # Public repository: Actions minutes are free (DD90). Only what the job tests: the Python API
  push:
    branches: [main, develop]
    paths: ['services/api/**', '.github/workflows/ci-security.yml']
  pull_request:
    paths: ['services/api/**', '.github/workflows/ci-security.yml']
  workflow_dispatch:

# The job only reads the repository: no token write scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - working-directory: ./services/api
        run: |
          pip install -r requirements.txt
          pytest -v
