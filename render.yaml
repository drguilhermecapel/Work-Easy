# ATENÇÃO: este serviço é o protótipo antigo (services/api). O produto real é apps/web.
# - Não defina ENABLE_DEMO_ROUTES aqui: as rotas de custódia Pix, SOS e reputação são FALSAS
#   (a custódia na própria plataforma exige parecer jurídico; veja apps/web/docs/DECISOES.md,
#   seção "Pagamento retido"). Com APP_ENV=production a API se recusa a subir se alguém ligar isso.
# - Não defina CORS_ALLOWED_ORIGINS com "*": liste só as origens que realmente chamam a API.
# - autoDeploy desligado: nada daqui vai ao ar sozinho a cada push. Decisão do dono: apagar este
#   serviço se a API não for mais usada.
services:
  - type: web
    name: workeasy-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
